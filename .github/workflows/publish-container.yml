name: publish container

on:
  push:
    paths:
      - aleph-builder.def
      - scripts/**
      - tools/**
      - .github/workflows/publish-container.yml
  pull_request:
    paths:
      - aleph-builder.def
      - scripts/**
      - tools/**
      - .github/workflows/publish-container.yml
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: check out repository
        uses: actions/checkout@v4

      - name: install singularity
        run: |
          set -euo pipefail
          # https://github.com/sylabs/singularity/releases/tag/v4.5.0
          deb=singularity-ce_4.5.0-noble_amd64.deb
          curl -fsSL -o "$deb" \
            "https://github.com/sylabs/singularity/releases/download/v4.5.0/${deb}"
          sudo apt-get update
          # uidmap: --fakeroot user namespaces for unprivileged image builds
          # squashfs-tools: assemble .sif / OCI squash layers
          # libtalloc2: required by proot if fakeroot is unavailable
          sudo apt-get install -y "./${deb}" uidmap squashfs-tools libtalloc2
          singularity --version

      - name: build singularity image
        run: singularity build --fakeroot --force aleph-builder.sif aleph-builder.def

      - name: publish to ghcr.io
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          name="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          image="oras://ghcr.io/${owner}/${name}"

          echo "${{ secrets.GITHUB_TOKEN }}" | \
            singularity registry login -u '${{ github.actor }}' --password-stdin oras://ghcr.io

          singularity push aleph-builder.sif "${image}:${short_sha}"

          # only move :latest on pushes to main (not PRs or other branches)
          if [ '${{ github.ref }}' = 'refs/heads/main' ]; then
            singularity push aleph-builder.sif "${image}:latest"
          fi
